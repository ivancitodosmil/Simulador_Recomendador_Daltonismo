<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ventas por región (visual aislado)</title>
  <!-- Visual estatico sin scripts: el index lo incrusta en un iframe con sandbox,
       donde la extension no puede inyectar su script y debe capturarlo recortado.
       Barras 2025 (azul oscuro #2E75B6) y 2024 (azul claro #9DC3E6). -->
  <style>
    body { margin: 0; background: #FFFFFF; font-family: "Segoe UI", system-ui, sans-serif; }
    svg { display: block; width: 100%; height: 100%; }
    text { font-size: 11px; fill: #5A6572; }
    .eje { stroke: #C9CFD6; stroke-width: 1; }
  </style>
</head>
<body>
  <svg viewBox="0 0 560 300" role="img" aria-label="Ventas por región, 2025 frente a 2024">
    <line class="eje" x1="52" y1="250" x2="540" y2="250"></line>
    <line class="eje" x1="52" y1="20" x2="52" y2="250"></line>
    <text x="8" y="254">0</text>
    <text x="8" y="140">1000</text>
    <text x="8" y="30">2000</text>
    <!-- Andalucía -->
    <rect x="70" y="95" width="28" height="155" fill="#2E75B6"></rect>
    <rect x="100" y="111" width="28" height="139" fill="#9DC3E6"></rect>
    <text x="68" y="270">Andalucía</text>
    <!-- Cataluña -->
    <rect x="150" y="43" width="28" height="207" fill="#2E75B6"></rect>
    <rect x="180" y="59" width="28" height="191" fill="#9DC3E6"></rect>
    <text x="154" y="270">Cataluña</text>
    <!-- Madrid -->
    <rect x="230" y="62" width="28" height="188" fill="#2E75B6"></rect>
    <rect x="260" y="77" width="28" height="173" fill="#9DC3E6"></rect>
    <text x="240" y="270">Madrid</text>
    <!-- C. Valenciana -->
    <rect x="310" y="124" width="28" height="126" fill="#2E75B6"></rect>
    <rect x="340" y="134" width="28" height="116" fill="#9DC3E6"></rect>
    <text x="304" y="270">C. Valenciana</text>
    <!-- Galicia -->
    <rect x="390" y="165" width="28" height="85" fill="#2E75B6"></rect>
    <rect x="420" y="169" width="28" height="81" fill="#9DC3E6"></rect>
    <text x="398" y="270">Galicia</text>
    <!-- P. Vasco -->
    <rect x="470" y="148" width="28" height="102" fill="#2E75B6"></rect>
    <rect x="500" y="156" width="28" height="94" fill="#9DC3E6"></rect>
    <text x="474" y="270">P. Vasco</text>
    <rect x="400" y="282" width="12" height="12" fill="#2E75B6"></rect>
    <text x="416" y="292">2025</text>
    <rect x="460" y="282" width="12" height="12" fill="#9DC3E6"></rect>
    <text x="476" y="292">2024</text>
  </svg>
</body>
</html>
