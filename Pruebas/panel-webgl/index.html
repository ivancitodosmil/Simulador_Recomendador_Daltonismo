<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel WebGL (Banco de pruebas)</title>
  <style>
    /* Panel WebGL: un canvas con contexto WebGL ocupa la mayor parte de la vista,
       como el lienzo de Figma. El filtro CSS no transforma su contenido, asi que
       la extension debe simular por captura y extraer la paleta del nivel 3. */
    body { margin: 0; background: #FFFFFF; color: #21262B; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    header { padding: 14px 24px 6px; }
    h1 { margin: 0 0 4px; font-size: 1.3rem; }
    .subtitulo { margin: 0; color: #5A6572; font-size: 0.9rem; }
    canvas { display: block; width: 100vw; height: 78vh; }
    .leyenda { list-style: none; display: flex; gap: 18px; margin: 8px 24px; padding: 0; font-size: 0.85rem; color: #5A6572; }
    .leyenda li { display: flex; align-items: center; gap: 6px; }
    .muestra { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    footer { padding: 0 24px 16px; font-size: 0.85rem; }
    footer a { color: #0B57D0; }
  </style>
</head>

<body>
  <header>
    <h1>Panel WebGL (lienzo como Figma)</h1>
    <p class="subtitulo">Ventas 2025 y 2024 por región dibujadas en un canvas WebGL que ocupa casi toda la vista.</p>
  </header>
  <canvas id="lienzo" role="img" aria-label="Barras por región en WebGL"></canvas>
  <ul class="leyenda" id="leyenda"></ul>
  <footer><a href="../index.html">← Volver al índice del banco de pruebas</a></footer>

  <script src="../panel-plataforma/datos.js"></script>
  <script>
    // Barras con WebGL puro: cada barra es un recorte (scissor) borrado con su
    // color, sin shaders, suficiente para reproducir un lienzo que el filtro
    // CSS no puede transformar.
    (function () {
      const canvas = document.getElementById("lienzo");
      const dpr = window.devicePixelRatio || 1;
      const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
      const colores = [COLOR_BARRA_2025, COLOR_BARRA_2024];
      const ejes = "#C9CFD6";

      function dibujar() {
        canvas.width = Math.round(canvas.clientWidth * dpr);
        canvas.height = Math.round(canvas.clientHeight * dpr);
        const gl = canvas.getContext("webgl", { preserveDrawingBuffer: true });
        if (!gl) return;
        const w = canvas.width;
        const h = canvas.height;
        gl.disable(gl.SCISSOR_TEST);
        gl.clearColor(1, 1, 1, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.enable(gl.SCISSOR_TEST);
        const rect = (x, y, ancho, alto, color) => {
          gl.scissor(Math.round(x), Math.round(y), Math.max(1, Math.round(ancho)), Math.max(1, Math.round(alto)));
          gl.clearColor(color[0], color[1], color[2], 1);
          gl.clear(gl.COLOR_BUFFER_BIT);
        };
        const margen = { izq: 60 * dpr, der: 30 * dpr, inf: 50 * dpr, sup: 30 * dpr };
        const anchoUtil = w - margen.izq - margen.der;
        const altoUtil = h - margen.inf - margen.sup;
        const maximo = Math.max.apply(null, VENTAS_2025_REGION.concat(VENTAS_2024_REGION));
        rect(margen.izq, margen.inf, anchoUtil, 2 * dpr, hex(ejes));
        rect(margen.izq, margen.inf, 2 * dpr, altoUtil, hex(ejes));
        const paso = anchoUtil / REGIONES_PLATAFORMA.length;
        REGIONES_PLATAFORMA.forEach((region, i) => {
          const x0 = margen.izq + paso * i + paso * 0.15;
          const anchoBarra = paso * 0.32;
          const h25 = (VENTAS_2025_REGION[i] / maximo) * altoUtil;
          const h24 = (VENTAS_2024_REGION[i] / maximo) * altoUtil;
          rect(x0, margen.inf + 2 * dpr, anchoBarra, h25, hex(colores[0]));
          rect(x0 + anchoBarra + paso * 0.06, margen.inf + 2 * dpr, anchoBarra, h24, hex(colores[1]));
        });
        gl.disable(gl.SCISSOR_TEST);
      }

      const leyenda = document.getElementById("leyenda");
      [["2025", colores[0]], ["2024", colores[1]]].forEach(([nombre, color]) => {
        const li = document.createElement("li");
        li.innerHTML = '<span class="muestra" style="background-color:' + color + '"></span>' + nombre;
        leyenda.appendChild(li);
      });

      dibujar();
      window.addEventListener("resize", dibujar);
    })();
  </script>
</body>

</html>
