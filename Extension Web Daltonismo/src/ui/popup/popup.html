<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Evaluador cromático de dashboards</title>
  <link rel="stylesheet" href="../estilos/tokens.css">
  <link rel="stylesheet" href="../estilos/componentes.css">
</head>
<body class="popup">
  <!-- Ajuste de UX (post-Sprint 3): toda la funcionalidad (simulación,
       extracción y evaluaciones) vive ahora en el panel lateral, y el clic
       en el icono lo abre directamente (openPanelOnActionClick). Este popup
       se conserva como superficie auxiliar mínima de la estructura fija del
       proyecto: solo enlaza con el panel. -->
  <header class="popup-cabecera">
    <h1>Evaluador cromático</h1>
    <p class="descripcion">La evaluación completa vive en el panel lateral.</p>
  </header>

  <main>
    <button id="open-panel-button" class="boton boton--primario" type="button"
            aria-label="Abrir el panel lateral de evaluación">
      Abrir panel de evaluación
    </button>
    <p id="status" class="estado" role="status" aria-live="polite"></p>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
